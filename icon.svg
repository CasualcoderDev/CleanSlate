<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2a" />
      <stop offset="100%" stop-color="#141412" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a46" />
      <stop offset="100%" stop-color="#1e1e1c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with gradient, border, and shadow -->
  <rect width="90" height="90" x="5" y="5" rx="22" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- The Emoji -->
  <text x="50" y="65" font-size="48" text-anchor="middle">🧹</text>
</svg>
